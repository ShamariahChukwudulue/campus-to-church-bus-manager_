<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TPCM Ride</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>


  <nav class="navbar">
    <a href="/index.html" class="nav-brand">
      <div class="icon-bus">🚌</div>
      <span>TPCM Ride</span>
    </a>
    <div class="nav-user" id="nav-user-container">
      <a href="/register.html" class="btn btn-outline btn-sm">Register</a>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo-icon">⛪</div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to access your church bus registration or admin panel</p>
      </div>

      <div id="alert-box"></div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="email">University Email Address</label>
          <input 
            type="email" 
            id="email" 
            class="form-control" 
            placeholder="e.g., student@university.edu" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
          Sign In
        </button>
      </form>

      <!-- Testing / Demo Helper -->
      <div class="demo-credentials-box">
        <strong>⚡ Quick Demo Credentials:</strong><br>
        Admin: <button type="button" id="fill-admin-btn">admin@campusbus.edu</button><br>
        Student: <button type="button" id="fill-student-btn">john.doe@university.edu</button>
      </div>

      <div class="auth-footer">
        Don't have an account? <a href="/register.html">Create Student Account</a>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      &copy; 2026 TPCM Ride &bull; Petra Prime Church
    </div>
  </footer>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
